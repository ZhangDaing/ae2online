plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {

    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true


    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')


            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    // ae2仓库
    maven {
        name = "Modmaven"
        url = "https://modmaven.dev/"
    }
    // guideme仓库
    maven {
        name = "MinecraftForge"
        url = "https://maven.minecraftforge.net/"
    }
    // jei仓库
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven{
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"


    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")
    implementation fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    compileOnly fg.deobf("maven.modrinth:jade:11.13.3+forge")
    
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("maven.modrinth:icon-exporter:1.20.1-1.4.0")
    runtimeOnly fg.deobf("maven.modrinth:cyclops-core:1.20.1-1.22.1")

} 
 
// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Example for how to get properties into the manifest for reading at runtime.
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file
    finalizedBy 'reobfJar'
}

// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing:
// tasks.named('publish').configure {
//     dependsOn 'reobfJar'
// }

// ============================================================
// Web 版 jar（内嵌浏览器 UI）
//
// 用法：
//   ./gradlew build      → 只产标准版 ae2online-<ver>.jar
//   ./gradlew webJar     → 产 Web 版 ae2online-<ver>-web.jar（需先导出 Godot Web 产物）
//   ./gradlew buildAll   → 两个都产
//
// Web 资源来源：godot/export/web/（Godot 的 Web 导出输出目录）
// 打包进 jar 的 assets/ae2online/web/，运行时由 WebServer 从 jar 内读取。
// ============================================================

def webSourceDir = file('godot/export/web')
def webJarResources = 'assets/ae2online/web'
def webPatchedDir = layout.buildDirectory.dir('web-patched')

// ============================================================
// Web 产物准备（直接复制，不再打补丁）
//
// 历史：曾在此处给 index.js 打补丁绕过 Secure Context 检查，
// 但绕过 isSecureContext 后 AudioWorklet 在非安全上下文中仍不可用，
// 会连锁报错（Cannot read properties of undefined (reading 'addModule')）。
// 现已改为由模组内置 HTTPS（自签名证书）从根上满足安全上下文要求，
// 因此不再需要任何 JS 补丁，此处只做文件复制。
// ============================================================
tasks.register('prepareWebAssets') {
    group = 'build'
    description = '准备 Godot Web 产物（原样复制，不打补丁）'

    onlyIf { webSourceDir.exists() }

    def srcDir = webSourceDir
    def outDir = webPatchedDir
    inputs.dir(srcDir).optional()
    outputs.dir(outDir)

    doLast {
        def target = outDir.get().asFile
        if (target.exists()) { delete target }
        target.mkdirs()
        copy {
            from srcDir
            into target
        }
        def count = target.listFiles()?.length ?: 0
        logger.lifecycle("Web 资源已就绪: ${count} 个文件（未打补丁，依赖 HTTPS 满足安全上下文）")
    }
}

// 关键：必须基于 reobf 后的标准版 jar（SRG 名）重新打包，
// 否则会带上 official 映射的字段名（如 Blocks.IRON_BLOCK），
// 在正式环境中运行时报 NoSuchFieldError。
tasks.register('webJar', Jar) {
    group = 'build'
    description = '构建内嵌 Web UI 的模组 jar（基于已重混淆的标准版 jar）'

    // 等标准版 jar 及其 reobf 完成；并先准备好 Web 产物
    dependsOn tasks.named('build')
    dependsOn tasks.named('prepareWebAssets')

    archiveBaseName = "${mod_id}"
    archiveVersion = "${mod_version}"
    archiveClassifier = 'web'
    destinationDirectory = file('build/libs')

    // 取出 reobf 后的标准版 jar 内容（不含 META-INF，避免签名冲突）
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }

    // 把打过补丁的 Godot Web 产物塞进 assets/ae2online/web/
    if (webSourceDir.exists()) {
        from(webPatchedDir) {
            into webJarResources
        }
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'AE2Online-WebUI'         : 'embedded'
        ])
    }

    doFirst {
        if (!webSourceDir.exists()) {
            logger.warn("⚠ Web 资源目录不存在: ${webSourceDir}")
            logger.warn("  请先导出 Godot Web 版到该目录，否则生成的 jar 不含 Web UI。")
        } else {
            def count = fileTree(webSourceDir).files.size()
            def sizeMb = (fileTree(webSourceDir).files.sum { it.length() } / 1024 / 1024)
            logger.lifecycle("内嵌 Web 资源: ${count} 个文件, ${String.format('%.1f', sizeMb)} MB")
        }
    }

    doLast {
        // 自检：确认打包进来的 class 用的是 SRG 名而不是 official 名
        def jarFile = archiveFile.get().asFile
        logger.lifecycle("Web 版 jar: ${jarFile.name} (${String.format('%.1f', jarFile.length() / 1024 / 1024)} MB)")
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = '构建标准版和 Web 版两个 jar'
    dependsOn tasks.named('build')
    dependsOn tasks.named('webJar')
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
